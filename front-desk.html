<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reconnect 2026 — Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#081B3F;--mid:#0F3A8A;--bright:#1E6FE0;--glow:#5FD4FF;
    --sage:#2F5D3F;--sage-bg:#E4EFE7;--coral:#B23A3A;--coral-bg:#F7E5E5;--slate:#5C6B73;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;min-height:100vh;
    background:linear-gradient(135deg,var(--deep) 0%,var(--mid) 55%,var(--bright) 100%);
    color:#fff;padding:24px;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .logo{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;}
  .logo span{color:var(--glow);}
  .screen-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:2px;}
  .refresh-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,0.7);
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .stat{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:16px 20px;text-align:center;}
  .stat-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:36px;color:var(--glow);line-height:1;}
  .stat-label{font-size:12px;color:rgba(255,255,255,0.65);margin-top:4px;text-transform:uppercase;letter-spacing:0.08em;}

  .main{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  @media(max-width:800px){.main{grid-template-columns:1fr;}}

  .person-card{
    background:rgba(255,255,255,0.97);border-radius:16px;padding:32px;color:#0A1E3D;
    box-shadow:0 20px 60px rgba(4,20,50,0.3);
  }
  .now-serving{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--slate);margin-bottom:12px;}
  .person-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:32px;line-height:1.1;margin-bottom:20px;}
  .person-queue{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;
    background:var(--deep);color:var(--glow);border-radius:6px;padding:4px 12px;margin-bottom:20px;
  }
  .details{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .detail-item label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .detail-item p{font-size:15px;font-weight:600;margin-top:2px;color:#0A1E3D;}

  .empty-card{
    background:rgba(255,255,255,0.15);border:2px dashed rgba(255,255,255,0.3);border-radius:16px;
    padding:48px 32px;text-align:center;
  }
  .empty-card h2{font-family:'Archivo',sans-serif;font-size:22px;margin-bottom:8px;}
  .empty-card p{color:rgba(255,255,255,0.65);font-size:14px;}

  .actions{display:flex;flex-direction:column;gap:14px;}
  .btn{
    width:100%;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;
    border:none;border-radius:10px;padding:18px;cursor:pointer;transition:transform .1s,opacity .15s;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn:hover:not(:disabled){transform:translateY(-1px);}
  .btn-collect{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;}
  .btn-skip{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);}
  .btn-skip:hover:not(:disabled){background:rgba(255,255,255,0.18);}

  .action-note{font-size:12px;color:rgba(255,255,255,0.5);text-align:center;margin-top:4px;font-family:'IBM Plex Mono',monospace;}

  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1e293b;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  #toast.show{opacity:1;}

  #error-bar{background:#fdecea;color:#B23A3A;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;display:none;}
  #error-bar.show{display:block;}

  /* Ad-hoc walk-up check-in */
  .adhoc-section{margin-top:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:24px;}
  .adhoc-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px;}
  .adhoc-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:16px;}
  .adhoc-row{display:flex;gap:10px;}
  .adhoc-input{flex:1;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;padding:13px 16px;font-size:15px;color:#fff;font-family:'Inter',sans-serif;}
  .adhoc-input::placeholder{color:rgba(255,255,255,0.4);}
  .adhoc-input:focus{outline:none;border-color:var(--glow);}
  .btn-find{background:var(--bright);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:15px;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
  .btn-find:disabled{opacity:0.5;cursor:not-allowed;}
  .adhoc-result{margin-top:16px;}
  /* Item delivery checkboxes */
  .item-checks{display:flex;gap:12px;margin-top:20px;padding-top:16px;border-top:1.5px solid #e2e8f0;}
  .item-check{display:flex;align-items:center;gap:10px;flex:1;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s;user-select:none;}
  .item-check input[type=checkbox]{width:18px;height:18px;accent-color:#0052CC;cursor:pointer;flex-shrink:0;}
  .item-check .ic-label{font-size:13px;font-weight:700;color:#374151;}
  .item-check .ic-sub{font-size:11px;color:#9ca3af;margin-top:2px;}
  .item-check.checked{border-color:#16a34a;background:#f0fdf4;}
  .item-check.checked .ic-label{color:#15803d;}
  /* Status badges */
  .status-badge{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:6px;padding:4px 10px;margin-bottom:16px;}
  .status-waiting{background:#dbeafe;color:#1d4ed8;}
  .status-collected{background:#dcfce7;color:#15803d;}
  .status-skipped{background:#fef9c3;color:#92400e;}
  .status-partial{background:#fff7ed;color:#c2410c;}
  .status-unknown{background:#f3f4f6;color:#6b7280;}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Deltek <span>Reconnect</span></div>
    <div class="screen-label">Front Desk</div>
  </div>
  <div class="refresh-badge"><span class="dot"></span><span>Live</span></div>
</header>

<div id="error-bar"></div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="statReg">—</div><div class="stat-label">Registered</div></div>
  <div class="stat"><div class="stat-num" id="statQueue">—</div><div class="stat-label">In Queue</div></div>
  <div class="stat"><div class="stat-num" id="statCollected">—</div><div class="stat-label">Collected</div></div>
</div>

<div class="main">
  <div id="personArea">
    <div class="empty-card"><h2>Loading…</h2><p>Fetching current person</p></div>
  </div>

  <div class="actions">
    <button class="btn btn-collect" id="btnCollect" disabled onclick="markAction('collected')">
      ✓ &nbsp;Mark as Collected
    </button>
    <button class="btn btn-skip" id="btnSkip" disabled onclick="markAction('skipped')">
      ↩ &nbsp;Didn't collect / stepped away
    </button>
    <div class="action-note">Auto-advances to next person</div>
  </div>
</div>

<!-- Search User section -->
<div class="adhoc-section" style="border-color:rgba(139,92,246,0.45);margin-top:20px;">
  <div class="adhoc-title">🔍 Search User</div>
  <div class="adhoc-sub">Find any employee regardless of status — use this to complete a partial collection or verify what someone received.</div>
  <div class="adhoc-row">
    <input class="adhoc-input" id="searchEmail" type="email" placeholder="employee@company.com" onkeydown="if(event.key==='Enter')searchUser()">
    <button class="btn-find" id="btnSearch" onclick="searchUser()" style="background:#7c3aed;">Search</button>
  </div>
  <div class="adhoc-result" id="searchResult"></div>
</div>

<div id="toast"></div>

<script>
// ── PASTE YOUR FLOW URLs HERE ──────────────────────────────────────────────
const GET_CURRENT_URL    = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/16c2055d77a14a2a88a079a5356cbdd6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=7CGLgoR_seUyJgHN0ZkcicpozX0M65cmhAPODp_RCvo";
const GET_STATS_URL      = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/25a59748dae1438f9115adb40206d285/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LSeDZNpjB2ge6r4JDJB8arOgHiVJxcbB33p_6itduyo";
const MARK_COLLECTED_URL = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/f1cdb7eafab64479bcb1e115cb8a9cd6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wTuHOq_nw-0OsmvIa9pzbKYh7zlKu4DpA5cZ3YCKkqg";
const MARK_SKIPPED_URL   = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/22/workflows/7f5bdb8bce6c41e3894cdd4d4a074ca0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=HoEu-lH94eQjwMobXd0CQKOfYGKg6M5xIlB7Ql20KWM";
const SEARCH_USER_URL    = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/d28f333cdae3422f965efc4416a6f57c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ZAdeWq9OCxdlOt2K0l7r914RpE5aUsSJGYhg8StNvrM"; // lookup-by-email flow
const SEARCH_EMPLOYEE_URL = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/8a39cbcb1f5646d49d3ff890d866a404/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=50Vnkl1Jx_sw1_zMmAyu-T_R8SVbEOget_fDnZdl0l0"; // employee table lookup
// ──────────────────────────────────────────────────────────────────────────

const REFRESH_MS = 5000;
let currentId = null;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show';
  setTimeout(() => el.className = '', 2500);
}

function renderPerson(p) {
  if (!p) {
    document.getElementById('personArea').innerHTML = `
      <div class="empty-card">
        <h2>Queue is clear</h2>
        <p>No one waiting — all caught up!</p>
      </div>`;
    document.getElementById('btnCollect').disabled = true;
    document.getElementById('btnSkip').disabled = true;
    currentId = null;
    return;
  }
  currentId = p.crf9c_registrationqueueid || p.crf9c_registrationqueuesid || p.id;
  const idChecked = getChecked(currentId, 'idcard');
  const tsChecked = getChecked(currentId, 'tshirt');
  document.getElementById('personArea').innerHTML = `
    <div class="person-card">
      <div class="now-serving">Now checking in</div>
      <div class="person-name">${p.crf9c_name || p.name}</div>
      <div class="person-queue">Next in Queue</div>
      <div class="details">
        <div class="detail-item"><label>Employee ID</label><p>${p.crf9c_employeeid || p.employeeId || '—'}</p></div>
        <div class="detail-item"><label>T-Shirt Size</label><p>${p.crf9c_tshirtsize || p.tshirtSize || '—'}</p></div>
        <div class="detail-item"><label>Team</label><p>${p.crf9c_team || p.team || '—'}</p></div>
        <div class="detail-item"><label>Email</label><p>${p.crf9c_email || p.email || '—'}</p></div>
      </div>
      <div class="item-checks">
        <label class="item-check${idChecked ? ' checked' : ''}" id="chk-idcard">
          <input type="checkbox" id="cb-idcard" ${idChecked ? 'checked' : ''} onchange="toggleItem('idcard')">
          <div><div class="ic-label">🪪 ID Card</div><div class="ic-sub">Check when given</div></div>
        </label>
        <label class="item-check${tsChecked ? ' checked' : ''}" id="chk-tshirt">
          <input type="checkbox" id="cb-tshirt" ${tsChecked ? 'checked' : ''} onchange="toggleItem('tshirt')">
          <div><div class="ic-label">👕 T-Shirt</div><div class="ic-sub">Check when given</div></div>
        </label>
      </div>
    </div>`;
  document.getElementById('btnCollect').disabled = false;
  document.getElementById('btnSkip').disabled = false;
}

async function loadCurrent() {
  try {
    const [cRes, sRes] = await Promise.all([
      fetch(GET_CURRENT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }),
      fetch(GET_STATS_URL,   { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    ]);
    const cText = await cRes.text();
    const sText = await sRes.text();
    let cData = {}, sData = {};
    try { cData = JSON.parse(cText); } catch {}
    try { sData = JSON.parse(sText); } catch {}

    document.getElementById('statReg').textContent       = sData.registered ?? '—';
    document.getElementById('statQueue').textContent     = sData.inQueue    ?? '—';
    document.getElementById('statCollected').textContent = sData.collected  ?? '—';

    renderPerson(cData.current || null);
    document.getElementById('error-bar').className = '';
  } catch (err) {
    document.getElementById('error-bar').className = 'show';
    document.getElementById('error-bar').textContent = 'Could not load data. Check your flow URLs.';
  }
}

async function markAction(type) {
  if (!currentId) return;
  const btnCollect = document.getElementById('btnCollect');
  const btnSkip = document.getElementById('btnSkip');
  btnCollect.disabled = true;
  btnSkip.disabled = true;
  const url = type === 'collected' ? MARK_COLLECTED_URL : MARK_SKIPPED_URL;
  try {
    const idCard = document.getElementById('cb-idcard')?.checked ?? false;
    const tShirt = document.getElementById('cb-tshirt')?.checked ?? false;
    const status = (idCard && tShirt) ? 'Collected' : 'Partially Collected';
    await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:currentId, idCard, tShirt, status: type==='collected'?status:undefined}) });
    if (type === 'collected') {
      const given = [idCard ? '🪪 ID Card' : '', tShirt ? '👕 T-Shirt' : ''].filter(Boolean);
      showToast(given.length === 2 ? '✓ Fully collected' : `⚠ Partially collected — given: ${given.join(', ') || 'none'}`);
    } else {
      showToast('↩ Moved to skipped');
    }
    await loadCurrent();
  } catch (err) {
    showToast('Error — please try again');
    btnCollect.disabled = false;
    btnSkip.disabled = false;
  }
}

const FLOW_URL = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/e363cfcbe824481a996db7108f6067e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=g6PYS4Aao7RicibmnGbKQ82A-yWjyidusogUgh-ob3g";
const GET_QUEUE_URL = "https://ab50a7c53d91ebe0af43536abffdf4.1c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/cdfede8642b74332a9e969ecb11446c3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xLwi6hBx0uUFq-UXgyKOCBuL0j1KCflH141XYx_GdV8";

function getChecked(id, item) {
  try { return localStorage.getItem(`fds_${id}_${item}`) === 'true'; } catch { return false; }
}
function saveChecked(id, item, val) {
  try { localStorage.setItem(`fds_${id}_${item}`, String(val)); } catch {}
}

function toggleItem(item) {
  const cb = document.getElementById(`cb-${item}`);
  const lbl = document.getElementById(`chk-${item}`);
  saveChecked(currentId, item, cb.checked);
  lbl.classList.toggle('checked', cb.checked);
}

const SEARCH_STATUS_MAP = {
  'Waiting':             ['status-badge status-waiting',   '● Waiting'],
  'Collected':           ['status-badge status-collected', '✓ Collected'],
  'Skipped':             ['status-badge status-skipped',   '↩ Skipped'],
  'Partially Collected': ['status-badge status-partial',   '⚠ Partially Collected'],
};

async function searchUser() {
  const email = document.getElementById('searchEmail').value.trim();
  if (!email) return;
  const btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = 'Searching…';
  const resultEl = document.getElementById('searchResult');
  resultEl.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px;padding:8px 0;">Checking queue records…</p>';
  try {
    // Step 1: search registration queue
    const res = await fetch(SEARCH_USER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
    const data = await res.json().catch(()=>({}));
    if (data.person) {
      renderSearchPerson(data.person);
    } else if (SEARCH_EMPLOYEE_URL) {
      // Step 2: not in queue — check employee table
      resultEl.innerHTML = '<p style="color:rgba(255,255,255,0.6);font-size:14px;padding:8px 0;">Not in queue — checking employee records…</p>';
      const empRes = await fetch(SEARCH_EMPLOYEE_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
      const empData = await empRes.json().catch(()=>({}));
      if (empData.employee) renderEmployeePerson(empData.employee);
      else resultEl.innerHTML = '<p style="color:#f87171;font-size:14px;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px;border:1px solid rgba(248,113,113,0.3);">✗ No record found in queue or employee database.</p>';
    } else {
      resultEl.innerHTML = '<p style="color:#f87171;font-size:14px;padding:12px;background:rgba(248,113,113,0.1);border-radius:8px;border:1px solid rgba(248,113,113,0.3);">✗ Not found in queue. To also search the employee table, configure SEARCH_EMPLOYEE_URL.</p>';
    }
  } catch {
    resultEl.innerHTML = '<p style="color:#f87171;font-size:14px;">Error — check flow URLs.</p>';
  }
  btn.disabled = false; btn.textContent = 'Search';
}

function renderSearchPerson(p) {
  const sId = p.crf9c_registrationqueueid || p.crf9c_registrationqueuesid || p.id;
  const idC = sId ? getChecked(sId, 'idcard') : false;
  const tsC = sId ? getChecked(sId, 'tshirt') : false;
  const status = p.crf9c_statustext || p.status || 'unknown';
  const [badgeClass, badgeText] = SEARCH_STATUS_MAP[status] || ['status-badge status-unknown', '— ' + status];
  const closeBtn = `<button class="btn btn-skip" style="flex:0 0 auto;width:auto;padding:18px 22px;" onclick="document.getElementById('searchResult').innerHTML='';document.getElementById('searchEmail').value='';">✕ Close</button>`;
  let actionBtn = '';
  if (status === 'Collected') {
    actionBtn = `<div style="flex:1;padding:14px;background:#fef2f2;border:2px solid #dc2626;border-radius:10px;text-align:center;"><div style="color:#dc2626;font-weight:800;font-size:15px;">✓ Already Collected</div><div style="color:#9ca3af;font-size:11px;margin-top:2px;">Items collected previously</div></div>`;
  } else if (sId) {
    actionBtn = `<button class="btn btn-collect" style="flex:1;width:auto;" onclick="markSearchCollected('${sId}')">✓ Mark as Collected</button>`;
  }
  const cancelBtn = `<button onclick="document.getElementById('searchResult').innerHTML='';document.getElementById('searchEmail').value='';" style="flex:0 0 auto;background:#f1f5f9;border:1.5px solid #e2e8f0;color:#475569;border-radius:10px;padding:14px 20px;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;">\u2715 Cancel</button>`;
  document.getElementById('searchResult').innerHTML = `
    <div class="person-card" style="margin-top:0;">
      <div class="now-serving" style="color:#7c3aed;">Search Result</div>
      <div class="person-name">${p.crf9c_name||p.name||'—'}</div>
      <span class="${badgeClass}">${badgeText}</span>
      <div class="details">
        <div class="detail-item"><label>Employee ID</label><p>${p.crf9c_employeeid||p.employeeId||'—'}</p></div>
        <div class="detail-item"><label>T-Shirt Size</label><p>${p.crf9c_tshirtsize||p.tshirtSize||'—'}</p></div>
        <div class="detail-item"><label>Team</label><p>${p.crf9c_team||p.team||'—'}</p></div>
        <div class="detail-item"><label>Email</label><p>${p.crf9c_email||p.email||'—'}</p></div>
      </div>
      <div class="item-checks">
        <label class="item-check${idC?' checked':''}" id="search-chk-idcard">
          <input type="checkbox" id="search-cb-idcard" ${idC?'checked':''} onchange="toggleSearchItem('idcard','${sId||''}')">
          <div><div class="ic-label">🪪 ID Card</div><div class="ic-sub" id="search-sub-idcard">${idC?'Given':'Not given'}</div></div>
        </label>
        <label class="item-check${tsC?' checked':''}" id="search-chk-tshirt">
          <input type="checkbox" id="search-cb-tshirt" ${tsC?'checked':''} onchange="toggleSearchItem('tshirt','${sId||''}')">
          <div><div class="ic-label">👕 T-Shirt</div><div class="ic-sub" id="search-sub-tshirt">${tsC?'Given':'Not given'}</div></div>
        </label>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        ${actionBtn}
        ${cancelBtn}
      </div>
    </div>`;
}

function toggleSearchItem(item, id) {
  const cb = document.getElementById(`search-cb-${item}`);
  const lbl = document.getElementById(`search-chk-${item}`);
  const sub = document.getElementById(`search-sub-${item}`);
  if (id) saveChecked(id, item, cb.checked);
  lbl.classList.toggle('checked', cb.checked);
  if (sub) sub.textContent = cb.checked ? 'Given' : 'Not given';
}

async function markSearchCollected(id) {
  try {
    const idCard = document.getElementById('search-cb-idcard')?.checked ?? false;
    const tShirt = document.getElementById('search-cb-tshirt')?.checked ?? false;
    const status = (idCard && tShirt) ? 'Collected' : 'Partially Collected';
    await fetch(MARK_COLLECTED_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, idCard, tShirt, status}) });
    const given = [idCard?'🪪 ID Card':'', tShirt?'👕 T-Shirt':''].filter(Boolean);
    showToast(given.length===2 ? '✓ Fully collected' : `⚠ Partially collected — given: ${given.join(', ')||'none'}`);
    document.getElementById('searchResult').innerHTML = '';
    document.getElementById('searchEmail').value = '';
    await loadCurrent();
  } catch { showToast('Error — please try again'); }
}

function renderEmployeePerson(emp) {
  const email = emp.crf9c_email || emp.email || '';
  const closeBtn = `<button class="btn btn-skip" style="flex:0 0 auto;width:auto;padding:18px 22px;" onclick="document.getElementById('searchResult').innerHTML='';document.getElementById('searchEmail').value='';">✕ Close</button>`;
  document.getElementById('searchResult').innerHTML = `
    <div class="person-card" style="margin-top:0;">
      <div class="now-serving" style="color:#d97706;">Employee — not registered in queue</div>
      <div class="person-name">${emp.crf9c_name||emp.name||'—'}</div>
      <span class="status-badge status-unknown">— Not in Queue</span>
      <div class="details">
        <div class="detail-item"><label>Employee ID</label><p>${emp.crf9c_employeeid||'—'}</p></div>
        <div class="detail-item"><label>T-Shirt Size</label><p>${emp.crf9c_tshirtsize||'—'}</p></div>
        <div class="detail-item"><label>Team</label><p>${emp.crf9c_team||'—'}</p></div>
        <div class="detail-item"><label>Email</label><p>${email}</p></div>
      </div>
      <div class="item-checks">
        <label class="item-check" id="emp-chk-idcard">
          <input type="checkbox" id="emp-cb-idcard" onchange="document.getElementById('emp-chk-idcard').classList.toggle('checked',this.checked)">
          <div><div class="ic-label">🪪 ID Card</div><div class="ic-sub">Check when given</div></div>
        </label>
        <label class="item-check" id="emp-chk-tshirt">
          <input type="checkbox" id="emp-cb-tshirt" onchange="document.getElementById('emp-chk-tshirt').classList.toggle('checked',this.checked)">
          <div><div class="ic-label">👕 T-Shirt</div><div class="ic-sub">Check when given</div></div>
        </label>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-collect" style="flex:1;width:auto;" onclick="markEmployeeCollected('${email}')">✓ Mark as Collected</button>
        ${closeBtn}
      </div>
    </div>`;
}

async function markEmployeeCollected(email) {
  const idCard = document.getElementById('emp-cb-idcard')?.checked ?? false;
  const tShirt = document.getElementById('emp-cb-tshirt')?.checked ?? false;
  const status = (idCard && tShirt) ? 'Collected' : 'Partially Collected';
  try {
    await fetch(FLOW_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
    const sr = await fetch(SEARCH_USER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
    const sd = await sr.json().catch(()=>({}));
    if (!sd.person) { showToast('Error — could not create queue entry'); return; }
    const id = sd.person.crf9c_registrationqueueid || sd.person.id;
    if (id) { saveChecked(id, 'idcard', idCard); saveChecked(id, 'tshirt', tShirt); }
    await fetch(MARK_COLLECTED_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, idCard, tShirt, status}) });
    const given = [idCard?'🪪 ID Card':'', tShirt?'👕 T-Shirt':''].filter(Boolean);
    showToast(given.length===2 ? '✓ Fully collected' : `⚠ Partially collected — given: ${given.join(', ')||'none'}`);
    document.getElementById('searchResult').innerHTML = '';
    document.getElementById('searchEmail').value = '';
    await loadCurrent();
  } catch { showToast('Error — please try again'); }
}

loadCurrent();
setInterval(loadCurrent, REFRESH_MS);
</script>
</body>
</html>
